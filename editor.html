<title>Architecture editor</title>
<style>
:root{--bg:#f6f7f9;--fg:#18202b;--muted:#566273;--line:#d7dde5;--card:#fff;--acc:#0f6a73}
@media (prefers-color-scheme:dark){:root{--bg:#10151c;--fg:#e4e9ef;--muted:#9aa7b7;--line:#2c3846;--card:#161d26;--acc:#5cc3cc}}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;padding:16px;box-sizing:border-box}
form{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:28px 26px;display:flex;flex-direction:column;gap:14px;width:min(320px,100%)}
h1{font-size:1.15rem;margin:0}
p{margin:0;color:var(--muted);font-size:.9rem}
input{font:600 1.6rem ui-monospace,Menlo,monospace;letter-spacing:.5em;text-align:center;padding:10px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg)}
input:focus-visible,button:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
button{font:600 .95rem system-ui,sans-serif;padding:10px;border:0;border-radius:10px;background:var(--acc);color:var(--bg);cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#err{color:#e5484d;min-height:1.2em}
</style></head>

<script>
(() => {
  const E = JSON.parse(document.getElementById('enc').textContent);
  const u = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const f = document.getElementById('f'), go = document.getElementById('go'), err = document.getElementById('err');
  f.addEventListener('submit', async ev => {
    ev.preventDefault();
    const pin = document.getElementById('pin').value.trim(); try { sessionStorage.setItem('dp-pin', pin); } catch (_) {}
    if (!/^\d{4}$/.test(pin)) { err.textContent = 'The PIN has 4 digits.'; return; }
    go.disabled = true; go.textContent = 'Opening…'; err.textContent = '';
    try {
      const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pin), 'PBKDF2', false, ['deriveKey']);
      const key = await crypto.subtle.deriveKey({ name: 'PBKDF2', salt: u(E.s), iterations: E.n, hash: 'SHA-256' }, base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
      const html = new TextDecoder().decode(await crypto.subtle.decrypt({ name: 'AES-GCM', iv: u(E.i) }, key, u(E.c)));
      document.open(); document.write(html); document.close();
    } catch (_) {
      err.textContent = 'That PIN is not right. Try again.'; go.disabled = false; go.textContent = 'Open';
    }
  });
  try { const p = sessionStorage.getItem('dp-pin'); if (p) { document.getElementById('pin').value = p; f.requestSubmit(); } } catch (_) {}
})();
</script>
